[project]
name = "xippios-usda-esmis"
version = "0.1.0"
description = "Typed client, MCP tools and HTTP routes for USDA ESMIS"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "XIPPIOS GmbH" }]
keywords = ["sdk", "usda-esmis", "agriculture", "mcp", "httpx", "pydantic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "xippios-core~=0.2.1",
]

[project.optional-dependencies]
mcp = ["xippios-core[mcp]~=0.2.1"]
http = ["xippios-core[http]~=0.2.1"]
testing = ["xippios-core[testing]~=0.2.1"]

[project.scripts]
xippios-usda-esmis-mcp = "xippios.usda.esmis.mcp:run"

[project.urls]
Homepage = "https://github.com/xippios/sdk-usda-esmis"
Upstream = "https://esmis.nal.usda.gov"
Changelog = "https://github.com/xippios/sdk-usda-esmis/blob/main/CHANGELOG.md"
Issues = "https://github.com/xippios/sdk-usda-esmis/issues"

[dependency-groups]
dev = [
  "ruff>=0.14",
  "mypy>=1.18",
  "pre-commit>=4",
  "pytest>=8",
  "respx>=0.22",
  "anyio>=4",
  "detect-secrets>=1.5",
]

[tool.uv.sources]
# Development only: xippios-core from git, for a core change that is not released yet.
# While the pin is set, uv takes core from it and ignores the version bound above.
# Before a release, remove the pin and raise core_version to the release that carries
# the pinned change: X.Y.Z with Z the patch that shipped it, or X.Y.0 when the minor
# itself did; still one minor. Then uv lock:
#   uvx copier update --defaults --vcs-ref=:current: -d core_git_ref= -d core_version=X.Y.Z
# The removal is a PR of its own, merged before the release PR; /release-prep and
# publish.yml refuse a pinned release.
xippios-core = { git = "https://github.com/xippios/sdk-core.git", rev = "cb8ecdf379c04522e5f1dcd91ea5e8bdfa1fb3ff" }  # pragma: allowlist secret (a git ref, not a key)

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xippios"]

[tool.hatch.build.targets.sdist]
# Anchored: hatch reads gitignore-style patterns, so a bare README.md would match
# tests/fixtures/README.md as well. The sdist ships no tests; they live in the repository.
include = ["/src", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", ".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "D", "ANN", "PTH", "PT", "T20", "C4"]
ignore = [
  "ANN401", # Any is allowed where upstream payloads are untyped by nature
  "D105",   # magic methods need no docstring
  "D107",   # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["xippios.usda.esmis"]
known-third-party = ["xippios.core"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]
